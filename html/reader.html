<main id="main">
  <div class="wrap">
    <div class="page-head">
      <h1>在线阅读</h1>
      <p class="lede">
        左侧为教材的真实目录（页码取自编译产物）。点击任意条目即在右侧定位到该页，
        也可用 <kbd>←</kbd> <kbd>→</kbd> 方向键逐章翻阅。
      </p>
    </div>

    <div class="reader-shell">

      <!-- 目录 -->
      <aside class="toc-pane" aria-label="教材目录">
        <div id="tocPane"></div>
        <div class="note" style="margin-top:1rem">

          <button class="btn" id="prevBtn" type="button">← 上一章</button>
          <button class="btn" id="nextBtn" type="button">下一章 →</button>
          <span style="color:var(--ink-2);font-size:var(--step--1);flex:1;min-width:8rem">
            <span id="chapterInfo">加载中…</span>
          </span>
          <span style="color:var(--ink-3);font-size:var(--step--1);font-variant-numeric:tabular-nums">
            当前位置 <span id="curPage">—</span>
          </span>
        </div>

        <iframe id="pdfFrame" class="pdf-frame" title="《电动力学》教材 PDF 正文"
                src="../electrodynamics_textbook_v2.pdf"></iframe>

        <noscript>
          <p class="note note-warn" style="margin-top:1rem">
